<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Garage Math Printable Worksheets</title>
  <link rel="stylesheet" href="print.css" />
</head>
<body>
  <header class="toolbar no-print">
    <a href="index.html">← Back to Garage Math</a>
    <div class="controls">
      <label>Week <select id="weekSelect"><option>Loading…</option></select></label>
      <label>Type <select id="typeSelect"><option value="worksheet">Worksheet</option><option value="key">Answer Key</option></select></label>
      <button id="openBtn">Open</button>
      <button id="printBtn">Open Printable PDF</button>
    </div>
  </header>

  <main>
    <section id="library" class="library no-print">
      <h1>Garage Math Printable Library</h1>
      <p>Choose any week below. The orange button opens a real PDF workbook so you can use the iPhone Share menu to print or save it.</p>
      <div id="libraryGrid" class="library-grid"></div>
    </section>
    <section id="sheet" class="sheet" hidden></section>
  </main>

  <div hidden>
    <div id="weekGrid"></div>
    <dialog id="weekDialog"><button class="close">x</button><div id="dialogContent"></div></dialog>
    <button id="printScope"></button>
  </div>

  <script src="boot.js?v=20260901-pdf1"></script>
  <script src="print-loader.js?v=20260901-pdf1"></script>
</body>
</html>
